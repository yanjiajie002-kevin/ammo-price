<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹药价格表 · 三角洲拍卖行</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080B0C'/%3E%3Crect x='6' y='12' width='4' height='12' fill='%23FFB43A'/%3E%3Crect x='14' y='7' width='4' height='17' fill='%23FF5A5F'/%3E%3Crect x='22' y='16' width='4' height='8' fill='%232BC98B'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#080B0C; --panel:#0C1214; --line:#1B2426; --line-soft:#141C1E;
    --txt:#D7E0DE; --dim:#7D8B89; --amber:#FFB43A; --up:#FF5A5F; --down:#2BC98B;
    --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
    --sans:"Bahnschrift","DIN Alternate","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt); font-family:var(--sans);
    -webkit-text-size-adjust:100%; padding-bottom:28px;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(12,18,20,.94);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .head-top{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
  h1{font-size:19px; line-height:1.15; margin:0; letter-spacing:.02em; font-weight:600}
  h1 span{display:block; font-family:var(--mono); font-size:11px; font-weight:400;
    color:var(--dim); letter-spacing:.16em; margin-top:5px; text-transform:uppercase}
  .stamp{font-family:var(--mono); font-size:11px; color:var(--dim); text-align:right; line-height:1.6}
  .stamp b{color:var(--amber); font-weight:500}
  .tools{display:flex; gap:8px; margin-top:12px}
  #q{
    flex:1; min-width:0; height:38px; padding:0 12px; font-size:16px;
    color:var(--txt); background:var(--panel); border:1px solid var(--line);
    border-radius:4px; font-family:var(--sans);
  }
  #q::placeholder{color:#5A6A68}
  #q:focus{outline:none; border-color:var(--amber)}
  #refresh{
    height:38px; padding:0 14px; font-size:13px; cursor:pointer;
    color:var(--txt); background:var(--panel); border:1px solid var(--line);
    border-radius:4px; font-family:var(--sans); min-width:64px;
  }
  #refresh:active{background:#101A1C}
  #refresh[disabled]{color:#5A6A68; cursor:default}
  table{width:100%; border-collapse:collapse; table-layout:fixed}
  thead th{
    position:sticky; top:132px; z-index:15; background:var(--bg);
    font-family:var(--mono); font-size:11px; font-weight:400; letter-spacing:.08em;
    color:var(--dim); text-align:right; padding:10px 16px 8px; cursor:pointer;
    border-bottom:1px solid var(--line); user-select:none;
  }
  thead th:first-child{text-align:left}
  thead th .ar{color:var(--amber); margin-left:3px}
  tbody td{padding:11px 16px; border-bottom:1px solid var(--line-soft); font-size:14px}
  tbody tr:last-child td{border-bottom:none}
  .name{color:var(--txt); line-height:1.35; word-break:break-word}
  .lv{
    display:inline-block; font-family:var(--mono); font-size:10px; color:var(--dim);
    border:1px solid var(--line); border-radius:2px; padding:0 4px; margin-left:6px;
    vertical-align:1px;
  }
  .price{text-align:right; font-family:var(--mono); font-size:15px; color:var(--amber);
    font-variant-numeric:tabular-nums; white-space:nowrap}
  .chg{text-align:right; font-family:var(--mono); font-size:13px; white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
  #state{
    padding:36px 16px; text-align:center; color:var(--dim); font-size:14px; line-height:1.8;
  }
  #state b{display:block; color:var(--txt); font-size:15px; margin-bottom:6px; font-weight:500}
  footer{
    margin:18px 16px 0; padding-top:12px; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; color:var(--dim); line-height:1.8;
  }
  @media (min-width:768px){
    header{padding:20px 28px 16px}
    h1{font-size:24px}
    h1 span{font-size:12px}
    thead th{padding:12px 28px; top:150px}
    tbody td{padding:13px 28px; font-size:15px}
    table{max-width:760px; margin:0 auto}
    footer{max-width:760px; margin:20px auto 0}
    header .inner, .tools{max-width:760px; margin-left:auto; margin-right:auto}
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <div class="head-top">
      <h1>弹药价格<span>AMMO AUCTION · PRICE BOARD</span></h1>
      <div class="stamp" id="stamp">读取中…</div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="搜索弹药名称" autocomplete="off">
      <button id="refresh" type="button">刷新</button>
    </div>
  </div>
</header>

<table>
  <colgroup>
    <col style="width:56%"><col style="width:20%"><col style="width:24%">
  </colgroup>
  <thead>
    <tr>
      <th data-sort="n">弹药</th>
      <th data-sort="p">现价<span class="ar" id="ar-p">↓</span></th>
      <th data-sort="c1">1 天<span class="ar" id="ar-c1"></span></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div id="state">正在读取云端数据…</div>

<footer id="foot">
  数据来自 deltaforcetools.gg 拍卖行 · 每 10 分钟自动同步一次 · 价格单位为交易币
</footer>

<script>
(function(){
  "use strict";

  var state = { items: [], q: "", sort: "p", dir: -1, updated: null, loaded: false };

  function $(s){ return document.querySelector(s); }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function fmtTime(ms){
    if (!ms) return "—";
    var d = new Date(ms);
    return pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtPrice(p){
    if (p === null || p === undefined || isNaN(p)) return "—";
    var n = Math.round(p * 10) / 10;
    return (n % 1 === 0) ? n.toLocaleString("en-US") : n.toFixed(1);
  }
  function pctOf(it){
    var p = it.p, c1 = it.c1;
    if (!p || p === c1 || c1 === undefined || c1 === null) return null;
    var base = p - c1;
    if (base <= 0) return null;
    return c1 / base * 100;
  }

  function render(){
    var rows = $("#rows"), tpl = [], i, it, pct, cls, txt;
    var list = state.items.slice();

    if (state.q){
      var q = state.q.toLowerCase();
      list = list.filter(function(x){ return (x.n || "").toLowerCase().indexOf(q) >= 0; });
    }

    list.sort(function(a, b){
      var va, vb;
      if (state.sort === "n"){ va = a.n || ""; vb = b.n || ""; return state.dir * (va < vb ? -1 : va > vb ? 1 : 0); }
      if (state.sort === "c1"){ va = pctOf(a); vb = pctOf(b);
        va = (va === null ? -999 : va); vb = (vb === null ? -999 : vb); return state.dir * (va - vb); }
      va = a.p || 0; vb = b.p || 0; return state.dir * (va - vb);
    });

    for (i = 0; i < list.length; i++){
      it = list[i];
      pct = pctOf(it);
      if (pct === null){ cls = "flat"; txt = "—"; }
      else if (pct > 0.05){ cls = "up"; txt = "+" + pct.toFixed(1) + "%"; }
      else if (pct < -0.05){ cls = "down"; txt = pct.toFixed(1) + "%"; }
      else { cls = "flat"; txt = "持平"; }
      tpl.push(
        '<tr>' +
          '<td><div class="name">' + esc(it.n || it.k) +
            (it.lv ? '<span class="lv">Lv' + esc(String(it.lv)) + '</span>' : '') + '</div></td>' +
          '<td class="price">' + fmtPrice(it.p) + '</td>' +
          '<td class="chg ' + cls + '">' + txt + '</td>' +
        '</tr>'
      );
    }

    rows.innerHTML = tpl.join("");
    $("#state").style.display = list.length ? "none" : "block";
    if (!list.length){
      $("#state").innerHTML = state.items.length
        ? "<b>没有匹配的弹药</b>换个关键词试试"
        : "<b>暂时没有数据</b>云端还没采集到这一轮";
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  function paintStamp(){
    var el = $("#stamp");
    if (!state.loaded){ el.textContent = "读取中…"; return; }
    el.innerHTML = "更新 <b>" + fmtTime(state.updated) + "</b><br>" + state.items.length + " 件在售";
  }

  function load(manual){
    var btn = $("#refresh");
    btn.disabled = true;
    btn.textContent = manual ? "更新中" : "刷新";
    fetch("data.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(d){
        if (!d || !d.items || !d.items.length) throw new Error("空数据");
        state.items = d.items;
        state.updated = (d.meta && (d.meta.lastPoll || d.meta.serverTime)) || Date.now();
        state.loaded = true;
        paintStamp();
        render();
        $("#foot").textContent = "数据来自 deltaforcetools.gg 拍卖行 · 每 10 分钟自动同步 · 源站更新 " +
          ((d.meta && d.meta.sourceUpdated) || "—");
      })
      .catch(function(e){
        state.loaded = true;
        if (!state.items.length){
          $("#state").style.display = "block";
          $("#state").innerHTML = "<b>取不到云端数据</b>刷新一下试试，或稍后再来（" + esc(e.message) + "）";
        }
        $("#stamp").innerHTML = "更新失败<br>点右上「刷新」重试";
      })
      .then(function(){
        btn.disabled = false;
        btn.textContent = "刷新";
      });
  }

  $("#refresh").addEventListener("click", function(){ load(true); });

  $("#q").addEventListener("input", function(e){
    state.q = e.target.value.trim();
    render();
  });

  Array.prototype.forEach.call(document.querySelectorAll("thead th"), function(th){
    th.addEventListener("click", function(){
      var key = th.getAttribute("data-sort");
      if (state.sort === key){ state.dir = -state.dir; }
      else { state.sort = key; state.dir = (key === "n") ? 1 : -1; }
      $("#ar-p").textContent = (state.sort === "p") ? (state.dir === -1 ? "↓" : "↑") : "";
      $("#ar-c1").textContent = (state.sort === "c1") ? (state.dir === -1 ? "↓" : "↑") : "";
      render();
    });
  });

  load(false);
  setInterval(function(){ load(false); }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
