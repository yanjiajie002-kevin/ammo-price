name: ammo-collect

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ammo-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集一轮源站行情
        run: python ammo_monitor.py --collect

      - name: 导出页面用的 data.json
        run: python build_static.py

      - name: 写回仓库
        run: |
          set -e
          git config user.name "ammo-bot"
          git config user.email "ammo-bot@users.noreply.github.com"
          git add data/store.json data.json
          if git diff --cached --quiet; then
            echo "这一轮数据没有变化，跳过提交"
            exit 0
          fi
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:${GITHUB_REF_NAME}
